<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Illustration of booking an appointment by phone or chat">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde8f2"/>
      <stop offset="1" stop-color="#e4f3fb"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2c78"/>
      <stop offset="1" stop-color="#2a1f5c"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#2a1f5c" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="480" height="300" fill="url(#bg)"/>
  <!-- soft background shapes -->
  <circle cx="70" cy="250" r="90" fill="#fbd3e6" opacity=".6"/>
  <circle cx="430" cy="40" r="80" fill="#cfe9f8" opacity=".7"/>
  <circle cx="400" cy="250" r="12" fill="#ffd25e"/>
  <circle cx="60" cy="60" r="8" fill="#2f9e44" opacity=".7"/>
  <circle cx="455" cy="150" r="6" fill="#e0559b"/>

  <!-- clock -->
  <g transform="translate(92 128)" filter="url(#sh)">
    <circle r="44" fill="#fff"/>
    <circle r="36" fill="none" stroke="#e4f3fb" stroke-width="6"/>
    <path d="M0 -22 V0 L15 10" fill="none" stroke="#2a1f5c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle r="4" fill="#e0559b"/>
  </g>

  <!-- phone -->
  <g transform="translate(176 26)" filter="url(#sh)">
    <rect width="128" height="250" rx="24" fill="url(#phone)"/>
    <rect x="9" y="12" width="110" height="226" rx="17" fill="#fcfaf6"/>
    <rect x="46" y="18" width="36" height="6" rx="3" fill="#2a1f5c" opacity=".25"/>
    <!-- chat header -->
    <circle cx="30" cy="44" r="10" fill="#2f9e44"/>
    <path d="M25 44 h10 M30 39 v10" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
    <rect x="46" y="38" width="46" height="5" rx="2.5" fill="#2a1f5c" opacity=".7"/>
    <rect x="46" y="47" width="30" height="4" rx="2" fill="#2a1f5c" opacity=".3"/>
    <!-- incoming bubble -->
    <rect x="18" y="70" width="74" height="30" rx="10" fill="#fff" stroke="#e7e2f2"/>
    <rect x="26" y="79" width="54" height="4" rx="2" fill="#2a1f5c" opacity=".35"/>
    <rect x="26" y="88" width="38" height="4" rx="2" fill="#2a1f5c" opacity=".25"/>
    <!-- outgoing bubble -->
    <rect x="36" y="110" width="74" height="40" rx="10" fill="#d6f5dc"/>
    <rect x="44" y="119" width="56" height="4" rx="2" fill="#237a34" opacity=".55"/>
    <rect x="44" y="128" width="48" height="4" rx="2" fill="#237a34" opacity=".4"/>
    <rect x="44" y="137" width="30" height="4" rx="2" fill="#237a34" opacity=".4"/>
    <path d="M90 143 l4 4 l8 -8" fill="none" stroke="#2b9ad6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- confirmation bubble -->
    <rect x="18" y="160" width="84" height="34" rx="10" fill="#fff" stroke="#e7e2f2"/>
    <circle cx="33" cy="177" r="8" fill="#2f9e44"/>
    <path d="M29 177 l3 3 l6 -6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="46" y="171" width="46" height="4" rx="2" fill="#2a1f5c" opacity=".4"/>
    <rect x="46" y="180" width="32" height="4" rx="2" fill="#2a1f5c" opacity=".25"/>
    <!-- input bar -->
    <rect x="16" y="208" width="72" height="20" rx="10" fill="#fff" stroke="#e7e2f2"/>
    <circle cx="102" cy="218" r="10" fill="#2f9e44"/>
    <path d="M98 218 h8 M103 214 l4 4 l-4 4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- calendar card -->
  <g transform="translate(330 92)" filter="url(#sh)">
    <rect width="112" height="118" rx="18" fill="#fff"/>
    <path d="M0 18 a18 18 0 0 1 18 -18 h76 a18 18 0 0 1 18 18 v14 h-112z" fill="#e0559b"/>
    <rect x="28" y="-8" width="8" height="20" rx="4" fill="#2a1f5c"/>
    <rect x="76" y="-8" width="8" height="20" rx="4" fill="#2a1f5c"/>
    <g fill="#e7e2f2">
      <rect x="14" y="44" width="16" height="14" rx="4"/><rect x="38" y="44" width="16" height="14" rx="4"/><rect x="62" y="44" width="16" height="14" rx="4"/><rect x="86" y="44" width="14" height="14" rx="4"/>
      <rect x="14" y="66" width="16" height="14" rx="4"/><rect x="62" y="66" width="16" height="14" rx="4"/><rect x="86" y="66" width="14" height="14" rx="4"/>
      <rect x="14" y="88" width="16" height="14" rx="4"/><rect x="38" y="88" width="16" height="14" rx="4"/><rect x="62" y="88" width="16" height="14" rx="4"/>
    </g>
    <rect x="36" y="63" width="20" height="20" rx="6" fill="#2f9e44"/>
    <path d="M41 73 l4 4 l7 -7" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- little hearts -->
  <path d="M352 236 c-6 -8 -18 -2 -12 8 l12 10 l12 -10 c6 -10 -6 -16 -12 -8z" fill="#e0559b" opacity=".85"/>
  <path d="M136 46 c-4 -5 -12 -1 -8 5 l8 7 l8 -7 c4 -6 -4 -10 -8 -5z" fill="#2b9ad6" opacity=".8"/>
</svg>
