<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Illustration of a treatment plan with prescription, medicine and healthy food">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf6e4"/>
      <stop offset="1" stop-color="#fff4d9"/>
    </linearGradient>
    <filter id="sh2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#2a1f5c" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="480" height="300" fill="url(#bg2)"/>
  <circle cx="420" cy="260" r="100" fill="#cdeebf" opacity=".6"/>
  <circle cx="50" cy="40" r="70" fill="#fde8f2" opacity=".8"/>
  <circle cx="90" cy="250" r="10" fill="#2b9ad6" opacity=".7"/>
  <circle cx="450" cy="60" r="8" fill="#e0559b"/>
  <circle cx="30" cy="160" r="6" fill="#ffd25e"/>

  <!-- clipboard with prescription -->
  <g transform="translate(150 30)" filter="url(#sh2)">
    <rect width="160" height="230" rx="18" fill="#2a1f5c"/>
    <rect x="12" y="20" width="136" height="198" rx="10" fill="#fff"/>
    <rect x="50" y="6" width="60" height="26" rx="10" fill="#3a2c78"/>
    <circle cx="80" cy="19" r="5" fill="#fcfaf6"/>
    <!-- Rx mark -->
    <text x="28" y="72" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#2f9e44">Rx</text>
    <rect x="76" y="50" width="56" height="5" rx="2.5" fill="#2a1f5c" opacity=".55"/>
    <rect x="76" y="61" width="40" height="5" rx="2.5" fill="#2a1f5c" opacity=".3"/>
    <!-- lines with checks -->
    <g>
      <circle cx="34" cy="100" r="8" fill="#eaf6e4"/><path d="M30 100 l3 3 l6 -6" fill="none" stroke="#2f9e44" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="50" y="96" width="80" height="5" rx="2.5" fill="#2a1f5c" opacity=".35"/>
      <circle cx="34" cy="128" r="8" fill="#eaf6e4"/><path d="M30 128 l3 3 l6 -6" fill="none" stroke="#2f9e44" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="50" y="124" width="66" height="5" rx="2.5" fill="#2a1f5c" opacity=".35"/>
      <circle cx="34" cy="156" r="8" fill="#e4f3fb"/><path d="M30 156 l3 3 l6 -6" fill="none" stroke="#2b9ad6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="50" y="152" width="74" height="5" rx="2.5" fill="#2a1f5c" opacity=".35"/>
    </g>
    <!-- signature -->
    <path d="M30 196 c10 -14 18 6 28 -6 s14 4 22 -4 s12 6 20 0" fill="none" stroke="#2a1f5c" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- syrup bottle -->
  <g transform="translate(330 96)" filter="url(#sh2)">
    <rect x="18" y="0" width="34" height="22" rx="6" fill="#e0559b"/>
    <rect x="22" y="20" width="26" height="12" fill="#f3a6c9"/>
    <path d="M8 46 a14 14 0 0 1 14 -14 h26 a14 14 0 0 1 14 14 v86 a14 14 0 0 1 -14 14 h-26 a14 14 0 0 1 -14 -14z" fill="#f7c873"/>
    <rect x="8" y="66" width="54" height="46" fill="#fff"/>
    <path d="M35 76 v26 M22 89 h26" stroke="#2f9e44" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- measuring spoon -->
  <g transform="translate(400 210) rotate(-25)">
    <rect x="0" y="-4" width="46" height="8" rx="4" fill="#2b9ad6"/>
    <ellipse cx="54" cy="0" rx="14" ry="10" fill="#2b9ad6"/>
    <ellipse cx="54" cy="-1" rx="9" ry="6" fill="#cfe9f8"/>
  </g>

  <!-- apple -->
  <g transform="translate(80 120)" filter="url(#sh2)">
    <path d="M30 14 c-20 -10 -40 6 -36 30 c4 26 22 40 36 32 c14 8 32 -6 36 -32 c4 -24 -16 -40 -36 -30z" fill="#e0559b"/>
    <path d="M30 14 c0 -10 4 -16 10 -20" fill="none" stroke="#2a1f5c" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M34 4 c10 -10 22 -6 24 0 c-8 6 -18 6 -24 0z" fill="#2f9e44"/>
    <ellipse cx="14" cy="30" rx="5" ry="9" fill="#fff" opacity=".35"/>
  </g>
  <!-- banana-ish carrot slice / pills -->
  <g transform="translate(62 222)">
    <rect x="0" y="0" width="36" height="16" rx="8" fill="#fff" stroke="#e7e2f2"/>
    <rect x="0" y="0" width="18" height="16" rx="8" fill="#2b9ad6"/>
    <rect x="46" y="6" width="36" height="16" rx="8" fill="#fff" stroke="#e7e2f2" transform="rotate(20 64 14)"/>
    <rect x="46" y="6" width="18" height="16" rx="8" fill="#2f9e44" transform="rotate(20 64 14)"/>
    <circle cx="104" cy="16" r="8" fill="#ffd25e"/>
  </g>

  <!-- heart -->
  <path d="M120 66 c-6 -8 -18 -2 -12 8 l12 10 l12 -10 c6 -10 -6 -16 -12 -8z" fill="#2f9e44" opacity=".85"/>
</svg>
